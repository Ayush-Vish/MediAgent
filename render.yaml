services:
  - type: web
    name: mediagent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CHANNEL_HASH_SECRET
        generateValue: true
      - key: HYBRID_ENABLED
        value: false
      - key: WHATSAPP_ENABLED
        value: false
